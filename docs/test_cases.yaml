    expected: 字体色即时生效并持久化；安全模式即时生效（禁壁纸/动效）并持久化；恢复默认成功。
    assert:
      - type: UI_ASSERT
        detail: "字体色/安全模式即时生效且重启保持；恢复默认成功"
      - type: LOG_ASSERT
        tag: "Theme"
        pattern: "(userTextColor=#|defaultTextColor=#4CFF80)"
    evidence: "1.9.158-tv/WLTV-P1-004_*.png；tv.log 摘录"
    requirement: "必测模块：设置（持久化）"

  - case_id: WLTV-P1-005
    module: 播放器
    priority: P1
    precondition: 点播可播放，且有 ≥2 条线路/清晰度。
    steps:
      - 播放页呼出控制条，打开「换源/线路」面板，切到另一条线路。
      - 观察切换后起播与进度衔接。
      - 打开「倍速」选 1.5×，观察生效；再切回 1.0×。
      - 打开「字幕」面板，开关字幕/切字幕源。
    expected: 换源可成功并继续播放；倍速生效可恢复；字幕开关/切源生效；各面板 BACK 可返回。
    assert:
      - type: UI_ASSERT
        detail: "换源成功；倍速生效；字幕生效；面板返回正常"
      - type: LOG_ASSERT
        tag: "Player"
        pattern: "(换源|speed|subtitle)"
    evidence: "1.9.158-tv/WLTV-P1-005_*.mp4；tv.log 摘录"
    requirement: "必测模块：播放器换源/倍速/字幕"

  - case_id: WLTV-P1-006
    module: 性能
    priority: P1
    precondition: 选取 ≥30 分钟点播；关闭屏保；电视散热正常。
    steps:
      - 起播后开始计时，每 5 分钟记录一次 `adb shell dumpsys meminfo com.whalefall.movie`。
      - 每 10 分钟抓 60s `dumpsys gfxinfo com.whalefall.movie framestats`。
      - 观察 20 分钟内是否出现明显掉帧/卡顿/发热/自动重载。
      - 20 分钟时统计 Memory 日志。
    expected: |
      5 分钟后 PSS 平稳，20 分钟增长 ≤10%；janky 帧 <5%；
      无频繁 blocking GC、无 ANR、无自动退出/重载；Memory 日志参数稳定。
    assert:
      - type: PERF_ASSERT
        detail: "PSS 20min 增长 ≤10%；janky 帧 <5%；无 blocking GC 风暴/ANR"
      - type: LOG_ASSERT
        tag: "Memory"
        pattern: "buffer=15s cache=64MB wallpaper=sample"
    evidence: "1.9.158-tv/meminfo-0/5/10/15/20min.txt、gfxinfo-*.txt；tv.log 摘录"
    requirement: "必测模块：连续播放 20 分钟稳定性（用户反馈掉帧）"

  - case_id: WLTV-P1-007
    module: 稳定性
    priority: P1
    precondition: 播放中可控制路由器/WiFi 断开。
    steps:
      - 播放中关闭 WiFi 30s，观察提示与恢复。
      - 恢复 WiFi，观察是否自动续播/可重试。
      - 播放中快速切台/切集 10 次。
    expected: 断网有明确提示不崩溃；恢复后可继续播放或一键重试；快速切换不 ANR/不黑屏。
    assert:
      - type: UI_ASSERT
        detail: "断网提示明确；恢复可播；快速切换不崩"
      - type: LOG_ASSERT
        tag: "MainActivity"
        pattern: "无 ANR in com.whalefall.movie"
    evidence: "1.9.158-tv/WLTV-P1-007_*.mp4；tv.log 摘录"
    requirement: "SOP 阶段6 兼容与异常"

  - case_id: WLTV-P1-008
    module: 壁纸
    priority: P1
