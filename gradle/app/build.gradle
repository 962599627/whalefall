plugins { id 'com.android.application' }

// 版本号单点定义：android/version.properties（与 Python 构建脚本共用）
def versionProps = new Properties()
file('../../android/version.properties').withInputStream { versionProps.load(it) }

android {
    namespace 'com.whalefall.movie'
    compileSdk 35

    defaultConfig {
        applicationId 'com.whalefall.movie'
        ndk { abiFilters 'arm64-v8a' }
        minSdk 23
        targetSdk 28
        versionCode versionProps.getProperty('versionCode').toInteger()
        versionName versionProps.getProperty('versionName')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['../../android/src/main/java', '../../shared/java']
            res.srcDirs = ['../../android/src/main/res']
            assets.srcDirs = ['../../android/src/main/assets']
        }
    }
    buildFeatures { buildConfig false }
    packaging { jniLibs { useLegacyPackaging = true } }
    lint { abortOnError false }
}

dependencies {
    implementation fileTree(dir: '../../tools/java-dependencies', include: ['*.jar'], exclude: ['annotations-13.0.jar'])
    implementation fileTree(dir: '../../tools/java-dependencies', include: ['*.aar'])
    // 1.9.149：腾讯 X5 内核（真实 client 子类需要编译期类）
    implementation files('../../libs/tbssdk-44286.jar')
}

// ---- P1 正式化：复用脚本产物（运行时 assets / jniLibs / release 签名） ----
android {
    sourceSets {
        main {
            jniLibs.srcDirs = ['../../../native-prebuilt/catpaw', '../../../native-prebuilt/deadline']

        }
    }
    signingConfigs {
        release {
            storeFile file('../../android/private/development.p12')
            storeType 'PKCS12'
            keyAlias 'marcomovie'
            storePassword System.getenv('MARCOMOVIE_KEY_PASSWORD') ?: ''
            keyPassword System.getenv('MARCOMOVIE_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

android {
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}


// ---- 运行时 assets 生成：直接复用 Python 构建脚本（catpaw 打包） ----
def repoRoot = rootProject.projectDir.parentFile
tasks.register('prepareRuntimeAssets', Exec) {
    workingDir repoRoot
    commandLine 'bash', '-lc', 'python3 scripts/build_android.py --assets-only'
    doFirst { println "preparing catpaw runtime assets via scripts/build_android.py --assets-only" }
}
tasks.named('preBuild').configure { dependsOn tasks.named('prepareRuntimeAssets') }


// ---- mobile / tv 两个 flavor：manifest 叠加 + 各自的运行时 assets ----
android {
    flavorDimensions 'edition'
    productFlavors {
        mobile {
            dimension 'edition'
            manifestPlaceholders = [whaleEdition: 'mobile']
        }
        tv {
            dimension 'edition'
            manifestPlaceholders = [whaleEdition: 'tv']
        }
    }
    sourceSets {
        mobile {
            assets.srcDirs += ['../../android/build/catpaw/assets-mobile']
        }
        tv {
            assets.srcDirs += ['../../android/build/catpaw/assets-tv']
        }
    }
}


// AGP 9 会自动引入新版 kotlin-stdlib；本地旧版 1.8.0 从 fileTree 排除（见 dependencies）
