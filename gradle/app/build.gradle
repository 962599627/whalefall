plugins { id 'com.android.application' }

android {
    namespace 'com.whalefall.movie'
    compileSdk 35

    defaultConfig {
        applicationId 'com.whalefall.movie'
        ndk { abiFilters 'arm64-v8a' }
        minSdk 23
        targetSdk 28
        versionCode 12000
        versionName '1.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['../../android/src/main/java', '../../shared/java']
            res.srcDirs = ['../../android/src/main/res']
            assets.srcDirs = ['../../android/src/main/assets']
        }
    }
    buildFeatures { buildConfig false }
    packaging { jniLibs { useLegacyPackaging = true } }
    lint { abortOnError false }
}

dependencies {
    implementation fileTree(dir: '../../tools/java-dependencies', include: ['*.jar'])
    implementation fileTree(dir: '../../tools/java-dependencies', include: ['*.aar'])
}

// ---- P1 正式化：复用脚本产物（运行时 assets / jniLibs / release 签名） ----
android {
    sourceSets {
        main {
            jniLibs.srcDirs = ['../../../native-prebuilt/catpaw', '../../../native-prebuilt/deadline']
            assets.srcDirs += ['../../android/build/catpaw/assets-mobile']
        }
    }
    signingConfigs {
        release {
            storeFile file('../../android/private/development.p12')
            storeType 'PKCS12'
            keyAlias 'marcomovie'
            storePassword System.getenv('MARCOMOVIE_KEY_PASSWORD') ?: ''
            keyPassword System.getenv('MARCOMOVIE_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

android {
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}


// ---- 运行时 assets 生成：直接复用 Python 构建脚本（catpaw 打包） ----
def repoRoot = rootProject.projectDir.parentFile
tasks.register('prepareRuntimeAssets', Exec) {
    workingDir repoRoot
    commandLine 'bash', '-lc', 'python3 scripts/build_android.py --assets-only'
    doFirst { println "preparing catpaw runtime assets via scripts/build_android.py --assets-only" }
}
tasks.named('preBuild').configure { dependsOn tasks.named('prepareRuntimeAssets') }
