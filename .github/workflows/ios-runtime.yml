name: iOS embedded source runtime regression
on:
  workflow_dispatch:
  push:
    branches: ['main', 'fix/plugin-ports-16kb-*']
    paths:
      - '.github/workflows/ios-runtime.yml'
      - 'scripts/ios_runtime/**'
      - 'scripts/fixtures/python_*'
      - 'scripts/run_ios_runtime_probe.py'
      - 'flutter/packages/catpaw_runtime/ios/Classes/**'
      - 'flutter/packages/quickjs_engine/**'
      - 'android/src/main/assets/python-host/**'
      - 'shared/catpaw/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  embedded:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run production engine in an iPhone simulator
        run: python3 scripts/run_ios_runtime_probe.py
      - name: Retain runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-embedded-runtime-evidence-${{ matrix.runner }}
          retention-days: 7
          path: |
            verification/ios-runtime/result.json
            ~/Library/Logs/DiagnosticReports/*RuntimeProbe*
            ~/Library/Logs/DiagnosticReports/*Node*
