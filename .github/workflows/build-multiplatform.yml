name: Build Multiplatform (Android / Windows / macOS / iOS)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  verify-and-checks:
    name: Public Guardrails & Offline Java Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - name: Check public content guardrails
        run: python scripts/check_public_content.py
      - name: Check Java formatting
        run: python scripts/format_java.py --check
      - name: Run pure-JVM regression checks
        run: |
          python android/tests/run_checks.py
          python android/tests/run_live_checks.py
          python android/tests/run_seek_checks.py
          python android/tests/run_review_fix_checks.py
          python android/tests/run_update_checks.py
          python android/tests/run_tv_input_checks.py

  build-windows:
    name: Build Windows Desktop (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Generate platform runner & build Windows release
        working-directory: flutter
        run: |
          python -c "import shutil; shutil.copytree('src', 'lib', dirs_exist_ok=True)"
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=marco_movie .
          python -c "import shutil; shutil.copytree('src', 'lib', dirs_exist_ok=True)"
          flutter pub get
          flutter test
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: MarcoMovie-Windows-x64
          path: flutter/build/windows/x64/runner/Release/

  build-macos:
    name: Build macOS Desktop (Apple Silicon & Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Generate platform runner & build macOS release
        working-directory: flutter
        run: |
          python3 -c "import shutil; shutil.copytree('src', 'lib', dirs_exist_ok=True)"
          flutter config --enable-macos-desktop
          flutter create --platforms=macos --project-name=marco_movie .
          python3 -c "import shutil; shutil.copytree('src', 'lib', dirs_exist_ok=True)"
          flutter pub get
          flutter test
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r MarcoMovie-macOS.app.zip marco_movie.app
      - uses: actions/upload-artifact@v4
        with:
          name: MarcoMovie-macOS-App
          path: flutter/build/macos/Build/Products/Release/MarcoMovie-macOS.app.zip

  build-ios:
    name: Build iOS & iPadOS (.ipa unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Generate platform runner & build iOS/iPadOS IPA
        working-directory: flutter
        run: |
          python3 -c "import shutil; shutil.copytree('src', 'lib', dirs_exist_ok=True)"
          flutter create --platforms=ios --org com.pilipala --project-name=marco_movie .
          python3 -c "import shutil; shutil.copytree('src', 'lib', dirs_exist_ok=True)"
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r MarcoMovie-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MarcoMovie-iOS-iPadOS-IPA
          path: flutter/build/ios/ipa/MarcoMovie-iOS-unsigned.ipa
