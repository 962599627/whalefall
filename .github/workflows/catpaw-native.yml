name: Validate CatPaw 16 KB runtime
on:
  workflow_dispatch:
  push:
    branches: ['fix/plugin-ports-16kb-*']
    paths:
      - '.github/workflows/catpaw-native.yml'
      - 'scripts/native/build_catpaw_node.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nodejs-mobile/nodejs-mobile
          ref: d9552e0e01ed5bdbe12a31d1ce6c0877a4f39580
          path: node-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed Android NDK and host dependencies
        run: |
          sdkmanager 'ndk;28.2.13676358'
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib g++-multilib
      - name: Compile Node from source and verify every LOAD segment
        run: python scripts/native/build_catpaw_node.py --source node-source --ndk "$ANDROID_HOME/ndk/28.2.13676358" --arch '${{ matrix.arch }}' --output node-output
      - uses: actions/upload-artifact@v4
        with:
          name: catpaw-16kb-${{ matrix.arch }}
          path: node-output/
          if-no-files-found: error
          retention-days: 14
